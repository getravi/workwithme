<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    cursor: default;
  }
  .pill {
    background: rgba(28, 28, 30, 0.90);
    border-radius: 22px;
    padding: 9px 18px;
    display: flex;
    align-items: center;
    gap: 8px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 0.5px solid rgba(255,255,255,0.12);
  }
  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
    animation: pulse 1.1s ease-in-out infinite;
  }
  .dot.listening   { background: #FF453A; }
  .dot.transcribing { background: #FF9F0A; animation-duration: 0.7s; }
  .text {
    color: rgba(255,255,255,0.92);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: -0.01em;
    white-space: nowrap;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.4; transform: scale(0.8); }
  }
</style>
</head>
<body>
  <div class="pill">
    <span class="dot listening" id="dot"></span>
    <span class="text" id="label">Listening…</span>
  </div>
  <script>
    function setState(s) {
      var dot   = document.getElementById('dot');
      var label = document.getElementById('label');
      if (s === 'transcribing') {
        dot.className   = 'dot transcribing';
        label.textContent = 'Transcribing\u2026';
      } else {
        dot.className   = 'dot listening';
        label.textContent = 'Listening\u2026';
      }
    }
    // Reset to listening state each time the window becomes visible
    document.addEventListener('visibilitychange', function() {
      if (!document.hidden) setState('listening');
    });
    // Listen for state updates from the Rust backend
    if (window.__TAURI__ && window.__TAURI__.event) {
      window.__TAURI__.event.listen('overlay-state', function(e) {
        setState(e.payload);
      });
    }
  </script>
</body>
</html>
